# Static landing page and shared docs theme, served behind the Traefik gateway.
# Runs as an unprivileged user on a read-only root filesystem; only /tmp is writable.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 1k; # GET/HEAD only

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Keep a well-formed client X-Request-ID (same rule as the services), else generate one.
    map $http_x_request_id $platform_request_id {
        "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
        default $request_id;
    }

    # One JSON object per line, matching the platform's shared log schema.
    log_format platform_json escape=json
        '{"@timestamp":"$time_iso8601","level":"INFO","logger_name":"access",'
        '"message":"$request_method $uri $status","service":"landing",'
        '"request_id":"$platform_request_id","http_method":"$request_method",'
        '"http_path":"$uri","http_status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout platform_json;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        error_page 404 /404.json;
        error_page 405 /405.json;

        location = / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Container health check only: the gateway never routes this path.
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}\n';
        }

        # RFC 9457 problem documents, like every other component behind the gateway.
        location = /404.json {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            default_type application/problem+json;
            return 404 '{"title":"Not Found","status":404}\n';
        }

        location = /405.json {
            internal;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Allow "GET, HEAD" always;
            default_type application/problem+json;
            return 405 '{"title":"Method Not Allowed","status":405}\n';
        }

        location / {
            return 404;
        }
    }
}
