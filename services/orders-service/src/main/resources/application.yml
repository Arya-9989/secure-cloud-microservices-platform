# All values can be overridden with environment variables using Spring's relaxed
# binding, e.g. SPRING_DATASOURCE_URL, PLATFORM_SECURITY_JWK_SET_URI.
spring:
  application:
    name: orders-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: ${SPRING_DATASOURCE_PASSWORD:} # no usable default on purpose
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

platform:
  security:
    issuer: urn:secure-platform:auth-service
    audience: secure-platform-api
    jwk-set-uri: http://auth-service:8000/.well-known/jwks.json
    clock-skew: 30s

management:
  server:
    port: 8081 # internal only: never routed through the gateway
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    build:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      service: orders-service
  observations:
    key-values:
      service: orders-service
    enable:
      # ~10 spans per request (one per security filter) that explain nothing.
      spring.security: false
  # Distributed tracing (docs/adr/0001-distributed-tracing.md). Off unless
  # MANAGEMENT_TRACING_EXPORT_ENABLED=true (TRACING_ENABLED in compose).
  tracing:
    export:
      enabled: false
    sampling:
      # Parent-based: a request is recorded when the gateway sampled it. Root spans
      # (health probes, scheduled jobs, calls that bypass the gateway) never are.
      probability: 0.0
    propagation:
      type: w3c # trace context only: no baggage from clients, no B3
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://jaeger:4318/v1/traces

# JDBC spans (datasource-micrometer): one per connection checkout and statement.
# Statements are recorded sanitised, never with parameter values.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false
  opentelemetry:
    metrics:
      enabled: false # Prometheus metrics stay as they are

springdoc:
  api-docs:
    path: /docs/orders/openapi.json
    # OpenAPI 3.0, like auth-service. Swagger UI resolves 3.1 documents through a
    # heavier code path, which costs main-thread time on phones.
    version: openapi_3_0
  swagger-ui:
    path: /docs/orders/swagger-ui.html # UI assets are served from /docs/orders/swagger-ui/
    # The themed page (web/ApiDocsPageController) boots Swagger UI from
    # static/docs/orders/api-docs.js, which holds the UI settings.
    disable-swagger-default-url: true

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: orders-service
      rename: # the same field names as the Python services
        traceId: trace_id
        spanId: span_id
  level:
    root: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
