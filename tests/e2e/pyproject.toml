[project]
name = "platform-e2e"
version = "1.0.0"
description = "Black-box tests that run against the docker compose stack through the gateway."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["ruff>=0.12", "mypy>=1.17"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "PT", "RUF"]
ignore = ["S101", "S105", "S106"]  # asserts and test credentials

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["."]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]
