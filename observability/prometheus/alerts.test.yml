# Unit tests for alerts.yml:
#   docker run --rm -v "$PWD/observability/prometheus:/rules:ro" --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules /rules/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: a target that stops answering pages after a minute
    interval: 1m
    input_series:
      - series: 'up{job="orders-service"}'
        values: "1 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: { severity: critical, job: orders-service }
            exp_annotations: { summary: "orders-service is not being scraped" }

  - name: service-reported 5xx above 5 % for 5 minutes
    interval: 1m
    input_series:
      # 10 requests per minute, 1 of them a 500 (10 %).
      - series: 'http_server_requests_seconds_count{job="auth-service",uri="/api/v1/auth/token/",status="200"}'
        values: "0+9x15"
      - series: 'http_server_requests_seconds_count{job="auth-service",uri="/api/v1/auth/token/",status="500"}'
        values: "0+1x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: HighServerErrorRate
        exp_alerts:
          - exp_labels: { severity: warning, job: auth-service }
            exp_annotations: { summary: "auth-service: more than 5% of requests fail with 5xx" }

  - name: gateway 5xx (no healthy backend) is caught even when the service reports nothing
    interval: 1m
    input_series:
      # The service is down, so only the gateway sees these requests: half are 503.
      - series: 'traefik_router_requests_total{router="orders@file",code="200",method="GET",protocol="http"}'
        values: "0+10x15"
      - series: 'traefik_router_requests_total{router="orders@file",code="503",method="GET",protocol="http"}'
        values: "0+10x15"
      - series: 'traefik_router_requests_total{router="auth@file",code="200",method="GET",protocol="http"}'
        values: "0+10x15"
    alert_rule_test:
      - eval_time: 4m
        alertname: GatewayErrorRate
        exp_alerts: []
      - eval_time: 12m
        alertname: GatewayErrorRate
        exp_alerts:
          - exp_labels: { severity: critical, router: orders@file }
            exp_annotations:
              summary: "orders@file: more than 5% of requests through the gateway fail with 5xx"

  - name: one refresh-token replay alerts immediately
    interval: 1m
    input_series:
      - series: "auth_refresh_token_reuse_detected_total"
        values: "0 0 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: RefreshTokenReuse
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "Refresh token replay detected: a session was revoked (possible token theft)"

  - name: sustained failed logins
    interval: 1m
    input_series:
      # 120 failures per minute = 2 per second.
      - series: 'auth_login_attempts_total{outcome="invalid_credentials"}'
        values: "0+120x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: LoginBruteForce
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "Sustained failed or throttled logins" }

  - name: slow p95 for 10 minutes
    interval: 1m
    input_series:
      # Every request lands in the (1, 2.5] second bucket.
      - series: 'http_server_requests_seconds_bucket{job="orders-service",uri="/api/v1/orders",le="1.0"}'
        values: "0x30"
      - series: 'http_server_requests_seconds_bucket{job="orders-service",uri="/api/v1/orders",le="2.5"}'
        values: "0+10x30"
      - series: 'http_server_requests_seconds_bucket{job="orders-service",uri="/api/v1/orders",le="+Inf"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SlowRequests
        exp_alerts:
          - exp_labels: { severity: warning, job: orders-service }
            exp_annotations: { summary: "orders-service: p95 latency above 1s" }
