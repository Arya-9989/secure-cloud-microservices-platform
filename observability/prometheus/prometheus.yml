global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: auth-service
    # Served by the gunicorn master on an internal-only port, aggregated over workers.
    static_configs:
      - targets: ["auth-service:9100"]

  - job_name: orders-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders-service:8081"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
