# Single entry point for the platform. Every route is explicit: anything not
# matched here gets a 404 from the gateway and never reaches a service.
#
# Traefik renders this file as a Go template. The only expression is the tracing
# switch: TRACING_ENABLED=true (compose) turns on spans for every router.
http:
  routers:
    auth:
      entryPoints: [web, websecure]
      rule: >-
        PathPrefix(`/api/v1/auth/`) || Path(`/.well-known/jwks.json`) ||
        PathPrefix(`/api/v1/admin/users`)
      middlewares: [security-headers, body-limit, auth-rate-limit]
      service: auth-service
      observability: { tracing: {{ eq (env "TRACING_ENABLED") "true" }} }

    # API docs get their own routers so only they are compressed: API responses
    # carrying tokens are never compressed (no BREACH-style length oracle).
    auth-docs:
      entryPoints: [web, websecure]
      rule: PathPrefix(`/docs/auth`)
      middlewares: [security-headers, body-limit, auth-rate-limit, compress-static]
      service: auth-service
      observability: { tracing: {{ eq (env "TRACING_ENABLED") "true" }} }

    orders:
      entryPoints: [web, websecure]
      rule: >-
        PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/products`) ||
        PathPrefix(`/api/v1/admin/orders`) || PathPrefix(`/api/v1/fulfilment/`) ||
        Path(`/.well-known/oauth-protected-resource`)
      middlewares: [security-headers, body-limit, api-rate-limit]
      service: orders-service
      observability: { tracing: {{ eq (env "TRACING_ENABLED") "true" }} }

    orders-docs:
      entryPoints: [web, websecure]
      rule: PathPrefix(`/docs/orders`)
      middlewares: [security-headers, body-limit, api-rate-limit, compress-static]
      service: orders-service
      observability: { tracing: {{ eq (env "TRACING_ENABLED") "true" }} }

    # The landing page and the shared docs theme. Only these two paths are
    # routed, so the landing container's own /healthz stays internal.
    landing:
      entryPoints: [web, websecure]
      rule: Path(`/`) || PathPrefix(`/assets/`)
      middlewares: [security-headers, body-limit, api-rate-limit]
      service: landing
      observability: { tracing: {{ eq (env "TRACING_ENABLED") "true" }} }

  middlewares:
    # Coarse, per-client-IP flood protection at the edge. Credential-stuffing
    # protection (per account) is enforced by the auth service itself.
    api-rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
    auth-rate-limit:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

    compress-static:
      compress: {}

    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576 # 1 MiB

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        stsSeconds: 31536000 # only emitted on HTTPS responses
        stsIncludeSubdomains: true
        customResponseHeaders:
          Server: "" # do not advertise the backend stack
          X-Powered-By: ""

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: http://auth-service:8000
        healthCheck:
          path: /readyz
          interval: 10s
          timeout: 3s

    landing:
      loadBalancer:
        servers:
          - url: http://landing:8080
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s

    orders-service:
      loadBalancer:
        servers:
          - url: http://orders-service:8080
        healthCheck:
          path: /actuator/health/readiness
          port: 8081
          interval: 10s
          timeout: 3s
