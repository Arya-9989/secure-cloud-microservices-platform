# Single entry point for the platform. Every route is explicit: anything not
# matched here gets a 404 from the gateway and never reaches a service.
http:
  routers:
    auth:
      entryPoints: [web, websecure]
      rule: >-
        PathPrefix(`/api/v1/auth/`) || Path(`/.well-known/jwks.json`) ||
        PathPrefix(`/api/v1/admin/users`) || PathPrefix(`/docs/auth`)
      middlewares: [security-headers, body-limit, auth-rate-limit]
      service: auth-service

    orders:
      entryPoints: [web, websecure]
      rule: >-
        PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/products`) ||
        PathPrefix(`/api/v1/admin/orders`) || PathPrefix(`/docs/orders`) ||
        Path(`/.well-known/oauth-protected-resource`)
      middlewares: [security-headers, body-limit, api-rate-limit]
      service: orders-service

  middlewares:
    # Coarse, per-client-IP flood protection at the edge. Credential-stuffing
    # protection (per account) is enforced by the auth service itself.
    api-rate-limit:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
    auth-rate-limit:
      rateLimit:
        average: 10
        period: 1s
        burst: 20

    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576 # 1 MiB

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        stsSeconds: 31536000 # only emitted on HTTPS responses
        stsIncludeSubdomains: true
        customResponseHeaders:
          Server: "" # do not advertise the backend stack
          X-Powered-By: ""

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: http://auth-service:8000
        healthCheck:
          path: /readyz
          interval: 10s
          timeout: 3s

    orders-service:
      loadBalancer:
        servers:
          - url: http://orders-service:8080
        healthCheck:
          path: /actuator/health/readiness
          port: 8081
          interval: 10s
          timeout: 3s
