# TLS policy for the websecure entry point.
#
# Locally Traefik serves its self-signed default certificate on :8443. For a
# real deployment mount a certificate and uncomment `certificates`, or add an
# ACME certificate resolver (Let's Encrypt) to the static configuration.
tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
  # certificates:
  #   - certFile: /etc/traefik/certs/tls.crt
  #     keyFile: /etc/traefik/certs/tls.key
