version: 2
updates:
  - package-ecosystem: uv
    directories: ["/services/auth-service", "/tests/e2e"]
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /services/orders-service
    schedule: { interval: weekly }
    groups:
      java:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/services/auth-service", "/services/orders-service", "/services/landing"]
    schedule: { interval: weekly }
    ignore:
      # Stay on LTS runtimes; Java and Python major upgrades are deliberate, not automated.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # nginx: even minors are the stable branch, odd minors are mainline. The
      # landing image stays on stable, so skip mainline releases but keep stable
      # patches (1.30.x) and the next stable branch (1.32).
      - dependency-name: "nginxinc/nginx-unprivileged"
        versions: ["1.31.x", "1.33.x", "1.35.x", "1.37.x", "1.39.x"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Postgres major upgrades need a dump/restore (PG 18 also changes the data directory layout).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
