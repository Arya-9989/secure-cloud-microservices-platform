version: 2
updates:
  - package-ecosystem: uv
    directories: ["/services/auth-service", "/tests/e2e"]
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /services/orders-service
    schedule: { interval: weekly }
    groups:
      java:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/services/auth-service", "/services/orders-service"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
