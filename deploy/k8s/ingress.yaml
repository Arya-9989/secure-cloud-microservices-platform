# Edge routing mirrors gateway/dynamic/routes.yml, including its middlewares
# (middlewares.yaml): security headers, a 1 MiB body limit and per-IP rate
# limits, tighter on the auth routes. Two Ingresses because the rate limit
# differs per route group. TLS terminates at the ingress controller using the
# certificate in Secret "platform-tls" (e.g. issued by cert-manager).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-auth
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # <namespace>-<name>@kubernetescrd, comma-separated without spaces.
    traefik.ingress.kubernetes.io/router.middlewares: "secure-platform-security-headers@kubernetescrd,secure-platform-body-limit@kubernetescrd,secure-platform-auth-rate-limit@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.example.com]
      secretName: platform-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - { path: /api/v1/auth, pathType: Prefix, backend: { service: { name: auth-service, port: { name: http } } } }
          - { path: /api/v1/admin/users, pathType: Prefix, backend: { service: { name: auth-service, port: { name: http } } } }
          - { path: /api/v1/admin/audit-events, pathType: Prefix, backend: { service: { name: auth-service, port: { name: http } } } }
          - { path: /.well-known/jwks.json, pathType: Exact, backend: { service: { name: auth-service, port: { name: http } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # <namespace>-<name>@kubernetescrd, comma-separated without spaces.
    traefik.ingress.kubernetes.io/router.middlewares: "secure-platform-security-headers@kubernetescrd,secure-platform-body-limit@kubernetescrd,secure-platform-api-rate-limit@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.example.com]
      secretName: platform-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - { path: /api/v1/orders, pathType: Prefix, backend: { service: { name: orders-service, port: { name: http } } } }
          - { path: /api/v1/products, pathType: Prefix, backend: { service: { name: orders-service, port: { name: http } } } }
          - { path: /api/v1/admin/orders, pathType: Prefix, backend: { service: { name: orders-service, port: { name: http } } } }
          - { path: /api/v1/fulfilment, pathType: Prefix, backend: { service: { name: orders-service, port: { name: http } } } }
          - { path: /.well-known/oauth-protected-resource, pathType: Exact, backend: { service: { name: orders-service, port: { name: http } } } }
