# Required secret (not committed):
#   orders-service-secrets: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#                           SPRING_DATASOURCE_PASSWORD
# Flyway migrates on startup; it takes a PostgreSQL advisory lock, so several
# replicas starting at once are safe.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-service
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  labels:
    app.kubernetes.io/name: orders-service
spec:
  selector:
    app.kubernetes.io/name: orders-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  labels:
    app.kubernetes.io/name: orders-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: orders-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40 # > Spring's graceful shutdown window
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-service
      containers:
        - name: orders-service
          image: orders-service
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            - name: PLATFORM_SECURITY_ISSUER
              valueFrom: { configMapKeyRef: { name: platform-config, key: JWT_ISSUER } }
            - name: PLATFORM_SECURITY_AUDIENCE
              valueFrom: { configMapKeyRef: { name: platform-config, key: JWT_AUDIENCE } }
            - name: PLATFORM_SECURITY_JWK_SET_URI
              value: http://auth-service:8000/.well-known/jwks.json
            - name: SPRINGDOC_API_DOCS_ENABLED
              value: "false"
            - name: SPRINGDOC_SWAGGER_UI_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: orders-service-secrets
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
