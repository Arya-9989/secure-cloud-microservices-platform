apiVersion: v2
name: secure-platform
description: >-
  The API tier of the Secure Cloud Microservices Platform: auth-service (RS256 JWTs,
  JWKS, client credentials + DPoP) and orders-service (OAuth2 resource server), with
  Traefik ingress middlewares and default-deny NetworkPolicies. Renders the same
  resources as deploy/k8s (Kustomize); CI checks that they agree.
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/Arya-9989/secure-cloud-microservices-platform
sources:
  - https://github.com/Arya-9989/secure-cloud-microservices-platform
maintainers:
  - name: Arya Mahindrakar
    url: https://github.com/Arya-9989
keywords: [oauth2, jwt, dpop, spring-boot, django, traefik]
