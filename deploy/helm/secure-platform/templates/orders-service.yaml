{{- $o := .Values.ordersService -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orders-service
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: orders-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
---
# Flyway migrates on startup; it takes a PostgreSQL advisory lock, so several replicas
# starting at once are safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orders-service
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: {{ $o.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
        # Roll the pods when the platform config changes (Kustomize's hashed ConfigMap name).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: orders-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40 # > Spring's graceful shutdown window
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-service
      containers:
        - name: orders-service
          image: {{ include "platform.image" (list . $o.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            - name: PLATFORM_SECURITY_ISSUER
              valueFrom: { configMapKeyRef: { name: platform-config, key: JWT_ISSUER } }
            - name: PLATFORM_SECURITY_AUDIENCE
              valueFrom: { configMapKeyRef: { name: platform-config, key: JWT_AUDIENCE } }
            - name: PLATFORM_SECURITY_RESOURCE
              value: {{ .Values.platform.ordersResource | quote }}
            - name: PLATFORM_SECURITY_JWK_SET_URI
              value: http://auth-service:8000/.well-known/jwks.json
            - name: SPRINGDOC_API_DOCS_ENABLED
              value: "false"
            - name: SPRINGDOC_SWAGGER_UI_ENABLED
              value: "false"
            {{- if .Values.tracing.enabled }}
            - name: MANAGEMENT_TRACING_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ printf "%s/v1/traces" .Values.tracing.otlpEndpoint | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $o.existingSecret }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $o.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
{{- if $o.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  minReplicas: {{ $o.autoscaling.minReplicas }}
  maxReplicas: {{ $o.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $o.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
