{{- if .Values.authService.migrations.enabled }}
{{- $a := .Values.authService -}}
# Schema migrations run once per release, before the new pods roll out, never from every
# replica. It is a Helm hook (Argo CD runs Helm hooks as PreSync hooks), so it brings its
# own ServiceAccount and environment: hooks run before the other resources exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-service-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: auth-service-migrate
    {{- include "platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service-migrate
    spec:
      serviceAccountName: auth-service-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "platform.image" (list . $a.image) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              python manage.py migrate --noinput &&
              python manage.py createcachetable &&
              python manage.py bootstrap_admin
          env:
            - name: JWT_ISSUER
              value: {{ .Values.platform.issuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.platform.audience | quote }}
          envFrom:
            - secretRef:
                name: {{ $a.existingSecret }}
          securityContext:
            {{- include "platform.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
{{- end }}
